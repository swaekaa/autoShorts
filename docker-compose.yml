services:
  db:
    image: postgres:16-alpine
    container_name: auto_shorts_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shorts_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shorts_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-auto_shorts}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shorts_user} -d ${POSTGRES_DB:-auto_shorts}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto_shorts_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shorts_user}:${POSTGRES_PASSWORD:-shorts_password_change_me}@db:5432/${POSTGRES_DB:-auto_shorts}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
